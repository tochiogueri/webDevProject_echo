<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d16">
  <meta name="description" content="ECHO: discover songs, build collaborative playlists and find your music DNA.">
  <title>ECHO · Find your frequency</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" data-nav="home" aria-label="Echo home">
        <span class="brand-symbol"><span></span><span></span><span></span><span></span></span>
        <span>ECHO<span class="brand-dot">.</span></span>
      </a>
      <div class="sidebar-section-label">YOUR SPACE</div>
      <nav class="side-links" id="side-nav">
        <button class="nav-link active" data-nav="home"><span class="nav-glyph">⌂</span> Home <span class="nav-key">01</span></button>
        <button class="nav-link" data-nav="discover"><span class="nav-glyph">◎</span> Discover <span class="nav-key">02</span></button>
        <button class="nav-link" data-nav="playlists"><span class="nav-glyph">▤</span> My Library <span class="nav-key">03</span></button>
      </nav>
      <div class="sidebar-section-label second-label">GO DEEPER</div>
      <nav class="side-links">
        <button class="nav-link" data-nav="generator"><span class="nav-glyph">✳</span> Mix Lab <span class="nav-pill">NEW</span></button>
        <button class="nav-link" data-nav="dna"><span class="nav-glyph">◈</span> Music DNA</button>
        <button class="nav-link" data-nav="connect"><span class="nav-glyph">☷</span> Connect</button>
        <button class="nav-link" data-nav="recognize"><span class="nav-glyph">◉</span> Recognize</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-feature">
        <div class="feature-spark">✳</div>
        <strong>Your next obsession starts here.</strong>
        <p>A whole new mix is one mood away.</p>
        <button data-nav="generator">Make a mix <span>↗</span></button>
      </div>
      <div class="sidebar-bottom"><span class="online-dot"></span> MADE FOR MUSIC PEOPLE <span>© 2026</span></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-symbol small"><span></span><span></span><span></span><span></span></span> ECHO<span class="brand-dot">.</span></div>
        <div class="topbar-right"><span class="topbar-tag"><span class="online-dot"></span> YOUR MUSIC, YOUR UNIVERSE</span><button class="avatar-button" id="account-button" data-action="account" aria-label="Account">↗</button></div>
      </header>
      <main id="main-content" tabindex="-1" aria-live="polite"></main>
      <footer class="page-footer">ECHO / FIND YOUR FREQUENCY <span>BUILT WITH MUSIC AND A LITTLE OBSESSION ✳</span></footer>
    </div>
  </div>

  <div class="player" id="player" aria-label="Music preview player">
    <div class="player-song"><div id="player-art" class="player-cover">♫</div><div class="player-song-info"><strong id="player-title">Nothing playing yet</strong><span id="player-artist">Find a song to get started</span></div></div>
    <div class="player-center"><div class="player-buttons"><button id="prev-button" title="Previous" aria-label="Previous song">|◀</button><button id="play-button" class="main-play" title="Play or pause" aria-label="Play or pause">▶</button><button id="next-button" title="Next" aria-label="Next song">▶|</button></div><div class="progress-row"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position"><span id="total-time">0:30</span></div></div>
    <div class="player-extra"><span>♫</span><input id="volume" type="range" min="0" max="100" value="70" aria-label="Volume"><span class="preview-tag">30s PREVIEW</span></div>
  </div>

  <nav class="mobile-tabs" aria-label="Mobile navigation">
    <button data-nav="home"><span>⌂</span>Home</button><button data-nav="discover"><span>◎</span>Discover</button><button data-nav="playlists"><span>▤</span>Library</button><button data-nav="generator"><span>✳</span>Mix Lab</button><button data-nav="connect"><span>☷</span>Social</button>
  </nav>
  <dialog id="modal" aria-label="Dialog"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
